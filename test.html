<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="kutu">Merhaba</div>
<button id="b">Tıkla</button>
<p id="s">Bekliyor</p>
<script>
  b.onclick = function () {
    document.getElementById("s").textContent = "Tıklandı";
  };
  setTimeout(function () {
    document.getElementById("s").textContent = "Zaman doldu";
  }, 1000);
</script>
</body>
</html>
